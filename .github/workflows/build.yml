name: Build

on:
  push:
    branches: [main, dew, fork]
  pull_request:
    branches: [main, dew, fork]

jobs:
  build:
    runs-on: macos-26   # the Liquid Glass API needs the macOS 26 SDK
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Test screen geometry
        run: bash scripts/test-screen-geometry.sh

      - name: Test link filter
        run: bash scripts/test-safe-links.sh

      - name: Build
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
